[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-redact"
version = "0.1.0"
description = "AI-powered video redaction: redact people from videos based on a runtime-specified prompt"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics",
    "opencv-python",
    "numpy",
    "pillow",
    "torch",
    "transformers",
]

[project.scripts]
auto-redact = "auto_redact.cli:main"

[tool.setuptools.packages.find]
include = ["auto_redact*"]
